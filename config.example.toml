# Copy this file to config.toml, or configure everything directly from the GUI.
poll_milliseconds = 250
ui_language = "en" # en | ru

# Every ticker has its own market and cancellation side.
# Supported sides: buy | sell | both
# Supported symbol input in the GUI includes:
#   BTC, BTCUSDT, BTC/USDT, BTC\USDT, BTCUSDC, BTC/USDC, BTC\USDC
# Symbols are normalized to BASE/USDT or BASE/USDC when the configuration is saved.

[binance]
api_key = ""
api_secret = ""
symbols = [
  { market = "futures", symbol = "BTC/USDT", side = "sell" },
  { market = "spot", symbol = "ETH/USDT", side = "both" },
  { market = "futures", symbol = "LA/USDT", side = "buy" },
  { market = "spot", symbol = "LA/USDC", side = "buy" },
]

[okx]
api_key = ""
api_secret = ""
passphrase = ""
symbols = [
  { market = "swap", symbol = "BTC/USDT", side = "buy" },
  { market = "spot", symbol = "ETH/USDC", side = "sell" },
]

[bybit]
api_key = ""
api_secret = ""
symbols = [
  { market = "linear", symbol = "BTC/USDT", side = "both" },
  { market = "spot", symbol = "ETH/USDC", side = "buy" },
]
