[package]
name = "limit-canceller"
version = "0.3.4-egui.1"
edition = "2024"
description = "Automatic cancellation of active limit orders on Binance, OKX, and Bybit"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "default_fonts"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hex = "0.4.3"
hmac = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util", "net", "io-util"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"
